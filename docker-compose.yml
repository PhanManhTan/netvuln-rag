services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: netvuln-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: netvuln-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

volumes:
  qdrant_storage:
  ollama_storage:


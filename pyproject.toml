[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netvuln-rag"
version = "0.1.0"
description = "Extensible cited RAG for network vulnerability lookup"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["api", "config", "data_pipeline", "evaluation", "rag", "rag.*"]
namespaces = false

[tool.setuptools.package-data]
config = ["products*.json"]
evaluation = ["famous_cves.json", "questions.sample.jsonl"]
"rag.generation" = ["prompts.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

